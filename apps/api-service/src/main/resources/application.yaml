spring:
  application:
    name: api-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME:neondb}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration